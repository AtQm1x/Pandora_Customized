name: build

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ci build]') ||
      contains(github.event.pull_request.title, '[ci build]')
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            buildscript: ./scripts/build_linux.sh
          - os_name: Windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            buildscript: ./scripts/build_windows.sh
          - os_name: MacOS-arm64
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            buildscript: ./scripts/build_mac.sh

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install needed packages on Linux
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev libfuse2 libfuse2t64 file
        if: contains(matrix.platform.os, 'ubuntu')

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Run build script
        run: ${{ matrix.platform.buildscript }} ${{ github.ref_name }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.os_name }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Determine release info
        id: release_info
        run: |
          version=$(grep -m 1 'version =' Cargo.toml | cut -d '"' -f 2 || echo "5.3.1")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v${version}"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "name=Pandora Launcher ${tag}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          files: ./artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
